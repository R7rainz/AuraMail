
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ai_email
      POSTGRES_USER: ai_email_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_email_user -d ai_email"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://ai_email_user:${POSTGRES_PASSWORD}@postgres:5432/ai_email?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "user=ai_email_user password=${POSTGRES_PASSWORD} host=postgres port=5432 dbname=ai_email sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
